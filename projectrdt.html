<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Projects | Himesh Dhaker</title>
  <link rel="stylesheet" href="portfolio.css">
  <style>
    .projects-page {
      max-width: 1120px;
      margin: auto;
      padding: 70px 32px 90px
    }

    .projects-intro {
      max-width: 680px;
      margin: 0 0 42px
    }

    .projects-intro p:first-child {
      margin: 0 0 14px;
      color: var(--violet);
      font-size: .75rem;
      font-weight: 800;
      letter-spacing: .15em
    }

    .projects-intro h1 {
      margin: 0;
      font: 700 clamp(2.6rem, 5vw, 4.5rem)/1.03 'Space Grotesk', sans-serif;
      letter-spacing: -.065em
    }

    .projects-intro h1 span {
      color: var(--violet)
    }

    .projects-intro p:last-child {
      margin: 18px 0 0;
      color: var(--muted);
      line-height: 1.75
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 18px
    }

    .card {
      position: relative;
      display: flex;
      flex-direction: column;
      min-height: 265px;
      padding: 25px;
      border: 1px solid var(--line);
      border-radius: 20px;
      background: #fff;
      overflow: hidden;
      transition: transform .25s, box-shadow .25s
    }

    .card:hover {
      transform: translateY(-6px);
      box-shadow: 0 18px 35px rgba(31, 23, 75, .1)
    }

    .card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 5px;
      background: linear-gradient(90deg, #6d4aff, #77d9ff)
    }

    .project-number {
      margin: 3px 0 30px;
      color: #b5aaff;
      font: 700 1rem 'Space Grotesk', sans-serif
    }

    .card h2 {
      margin: 0 0 10px;
      font: 600 1.25rem 'Space Grotesk', sans-serif
    }

    .card p {
      margin: 0;
      color: var(--muted);
      line-height: 1.65;
      font-size: .91rem
    }

    .bottom {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-top: auto;
      padding-top: 24px
    }

    .status {
      padding: 6px 10px;
      border-radius: 999px;
      background: #f1efff;
      color: var(--violet);
      font-size: .74rem;
      font-weight: 800
    }

    .card a {
      color: var(--violet);
      font-size: .85rem;
      font-weight: 800;
      text-decoration: none
    }

    .card a:hover {
      text-decoration: underline
    }

    @media(max-width:800px) {
      .grid {
        grid-template-columns: 1fr 1fr
      }
    }

    @media(max-width:560px) {
      .projects-page {
        padding: 55px 24px
      }

      .grid {
        grid-template-columns: 1fr
      }
    }
  </style>
</head>

<body>
  <header><a href="portfolio.html" class="logo"><span>H</span>imesh.</a>
    <nav class="navigation"><a href="portfolio.html">Home</a><a href="about.html">About</a><a class="active"
        href="projectrdt.html">Projects</a><a href="contact.html">Contact</a></nav><a href="hire.html"
      class="btn-talk">Let's Talk</a>
  </header>
  <main class="projects-page">
    <section class="projects-intro">
      <p>SELECTED WORK</p>
      <h1>Ideas turned into <span>interfaces.</span></h1>
      <p>A small selection of projects that show the kind of web experiences I am building.</p>
    </section>
    <section class="grid" id="projectList"></section>
  </main>
  <script>
    const projects = [
      { name: 'Online Food Ordering', description: 'A responsive food ordering experience designed for easy browsing and clear calls to action.', status: 'Completed', link: 'https://zomato.com' },
      { name: 'Hiring Website', description: 'A streamlined platform concept that helps people explore opportunities and take the next step.', status: 'In progress', link: 'https://www.linkedin.com/' },
      { name: 'E-commerce Experience', description: 'A refined shopping journey focused on product discovery and a simpler customer flow.', status: 'Completed', link: 'https://www.shopify.com/in' }
    ];
    document.querySelector('#projectList').innerHTML = projects.map((project, index) => `<article class="card"><p class="project-number">0${index + 1}</p><h2>${project.name}</h2><p>${project.description}</p><div class="bottom"><span class="status">${project.status}</span><a href="${project.link}" target="_blank" rel="noopener">View project →</a></div></article>`).join('');
  </script>
</body>

</html>
